name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender
        run: npm run build

      - name: Verify static output
        run: |
          echo "=== Looking for index.html ==="
          find .output/public -name "index.html" -type f -print

          echo "=== Output ==="
          find .output/public -maxdepth 2 -type f | sort

          test -f .output/public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4